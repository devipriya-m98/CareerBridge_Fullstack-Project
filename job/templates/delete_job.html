{% extends 'base.html' %}
{% load static %}

{% block title %} Select Job to Delete | CareerBridge {% endblock title %}


{% block content %}


<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg border-0 rounded-4 p-4 text-center" style="max-width: 450px;">

    <h4 class="fw-bold text-dark mb-3">Delete Job</h4>
    <p class="text-muted">Are you sure you want to delete the job <br>
      <strong class="text-danger"> {{ job.job_title }} </strong>?
    </p>

    <form method="POST">
      {% csrf_token %}

      <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="{% url 'manage_job' %}" class="btn btn-secondary px-4 fw-semibold">Cancel</a>
        <button type="submit" class="btn btn-danger px-4 fw-semibold">Delete</button>
      </div>
    </form>
  </div>
</div>



{% endblock content %} 





{% block style %} 
  
{% endblock %}
